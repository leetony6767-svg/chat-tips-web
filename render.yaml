# Telegram + Agnes AI Bot — Render 部署配置
# 雲端獨立運行：本機電腦可關機，手機 Telegram 仍可操作並收 Agnes AI 回覆
# 部署方式（環境變數已寫死於下方 envVars，無需手填）：
#   1. 到 https://render.com 登入
#   2. New → Blueprint → 選擇此 repo 的 render.yaml
#   3. Deploy（環境變數自動套用）

name: tg-agnes-assistant
type: web
runtime: python
plan: free
region: oregon

build:
  commands:
    - pip install -r requirements.txt

start: python cloud_gateway.py

envVars:
  - key: TELEGRAM_BOT_TOKEN
    value: "8778107946:AAHSs1D43_Qmlr-s6UV5Oia9jMFO_-DNqiY"
  - key: AGNES_API_KEY
    value: "sk-cRmT17Jw2tCjOBxiejiL9sLANPoP82FGzecx7FjjOSmLRgHX"
  - key: AGNES_BASE_URL
    value: "https://apihub.agnes-ai.com/v1"
  - key: AGNES_MODEL
    value: "agnes-2.5-flash"
  # 本機 worker 驗證 key（須與 windows_worker.py 的 AGENT_KEY 一致）
  - key: AGENT_KEY
    value: "local-agent-key"
  # 允許控制本機的 Chat ID（留空則不限）
  - key: ALLOWED_CHAT_ID
    value: "7719075027"
  - key: RENDER
    value: "true"
